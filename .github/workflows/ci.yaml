name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go と lint・テストのツールは flake.nix の devShell から取る (usadamasa/gh-manage の setup-nix)。版の正本は flake.lock
# nix store の cache は Linux でも macOS でも restore の方が binary cache からの取得より遅いので、全 job で cache: false にする
jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      # analyze-modularity が揮発性を git の履歴から測り、base の commit を取り出す。shallow clone だと判定が効かない
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: Run all linters
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: task lint

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      # hook のテストは fake の go とバイナリで回るが、ソースが build できることもここで確かめる。
      - name: Build Go binaries
        run: task build

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # apt の shellcheck ではなく devShell で固定した版を使い、ローカルと結果を揃える
      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: Run shellcheck
        run: shellcheck hooks/*.sh hooks/lib/*.sh scripts/*.sh tests/lib/*.bash tests/fixtures/fake-go .envrc

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # ubuntu-latest は node と npm を同梱するので setup-node は要らない。
      # nodejs は devShell に入れず setup-nix も通さない。devShell の npm は global prefix が /nix/store になり npm i -g が落ちる
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate manifests and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

      - name: Test the mod
        run: claude plugin test .

  mod-typecheck:
    name: mod typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # .claude-plugin/types/ は対話セッションでしか書かれないので、ci/mod-types/ に写した型で検査する
      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: Typecheck the mod
        run: task typecheck

  # PR で変わったパスを .github/filters.yaml で振り分ける。pull_request では REST API から読むので pull-requests: read が要る
  changes:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gui: ${{ steps.filter.outputs.gui != 'false' }}
      models: ${{ steps.filter.outputs.models != 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: .github/filters.yaml

  # gui/ は Wails v3 の macOS のアプリ (cgo と WebKit の link) なので macOS の runner で回す。
  # node --test も同じジョブで回す (public repo は macOS の分も課金されないので ubuntu へ分けない)。
  # PR では filters.yaml の gui に当たるときだけ回し、main への push では毎回回す
  gui-test:
    name: gui test
    needs: [changes]
    if: needs.changes.outputs.gui == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: Test the gui module
        run: task gui:test

      # ui.test.js が fixture の図から書いたスナップショット。見た目を変える PR は before / after をここから取る
      - name: Upload gui snapshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gui-snapshots
          path: tmp/gui-snapshots
          if-no-files-found: ignore

  # models/ の TLA+ を TLC で回し、cfg ごとの期待 (反例なし / 反例あり) と突き合わせる。
  # PR では filters.yaml の models に当たるときだけ回し、main への push では毎回回す
  model-check:
    name: model check
    needs: [changes]
    if: needs.changes.outputs.models == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main
        with:
          cache: false

      - name: Run TLC
        run: task model-check

      # 反例の trace と期待に外れた cfg の log。期待どおりの反例も含む
      - name: Upload TLC logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tlc-logs
          path: tmp/tlc/*.log
          if-no-files-found: ignore

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/verify-actions-lock@main

  ci-status-check:
    needs: [go-test, go-lint, bats, shellcheck, plugin-validate, mod-typecheck, changes, gui-test, model-check, actions-lock]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
