name: ci

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Go と lint・テストのツールは flake.nix の devShell から取る (usadamasa/gh-manage の setup-nix)。版の正本は flake.lock
jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.out

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      # analyze-modularity が揮発性を git の履歴から測る。shallow clone だと判定が効かない
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Run all linters
        run: task lint

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: usadamasa/gh-manage/actions/setup-nix@main

      # hook のテストは fake の go とバイナリで回るが、ソースが build できることもここで確かめる。
      - name: Build Go binaries
        run: task build

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # apt の shellcheck ではなく devShell で固定した版を使い、ローカルと結果を揃える
      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Run shellcheck
        run: shellcheck hooks/*.sh hooks/lib/*.sh scripts/*.sh tests/lib/*.bash tests/fixtures/fake-go .envrc

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # ubuntu-latest は node と npm を同梱するので setup-node は要らない。
      # nodejs は devShell に入れず setup-nix も通さない。devShell の npm は global prefix が /nix/store になり npm i -g が落ちる
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate manifests and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

      - name: Test the mod
        run: claude plugin test .

  mod-typecheck:
    name: mod typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # .claude-plugin/types/ は対話セッションでしか書かれないので、ci/mod-types/ に写した型で検査する
      - uses: usadamasa/gh-manage/actions/setup-nix@main

      - name: Typecheck the mod
        run: task typecheck

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  ci-status-check:
    needs: [go-test, go-lint, bats, shellcheck, plugin-validate, mod-typecheck, actions-lock]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
