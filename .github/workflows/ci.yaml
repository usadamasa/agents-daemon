name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.53.3

      - name: Run all linters
        run: task lint

  bats:
    name: bats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: aquaproj/aqua-installer@v3.1.2
        with:
          aqua_version: v2.53.3

      # hook のテストは fake の go とバイナリで回るが、ソースが build できることもここで確かめる｡
      - name: Build Go binaries
        run: task build

      - name: Install bats-core
        run: |
          sudo apt-get update -q
          sudo apt-get install -y bats

      - name: Run bats tests
        run: bats tests/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck hooks/*.sh hooks/lib/*.sh scripts/*.sh tests/lib/*.bash tests/fixtures/fake-go .envrc

  plugin-validate:
    name: plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      # ubuntu-latest は node と npm を同梱するので setup-node は要らない
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate manifests and skills
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict skills

  actions-lock:
    name: actions-lock verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.2.0

      - name: Verify actions are locked
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify

  ci-status-check:
    needs: [go-test, go-lint, bats, shellcheck, plugin-validate, actions-lock]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
