version: 3

workdir: .

# Claude Code の worktree (.claude/worktrees/<name>/) はリポジトリの丸ごとの複製で、go-arch-lint は workdir の
# 下を全部走査してその中の .go も「component に無いファイル」として数える。.claude/ 配下は linter の対象にしない。
exclude:
  - .claude

# この設定自体の健全性は `go tool analyze-arch-lint --metrics` と `--strict .` で見る。
components:
  cmd_main:
    in: "cmd/**"
  internal:
    in: "internal/**"

vendors:
  cobra:
    in: github.com/spf13/cobra
  # rexcli のテストが fake の rex に渡った引数列を戻すのに使う。
  shellquote:
    in: github.com/kballard/go-shellquote

deps:
  cmd_main:
    mayDependOn:
      - cmd_main
      - internal
    canUse:
      - cobra
  internal:
    mayDependOn:
      - internal
    canUse:
      - shellquote
