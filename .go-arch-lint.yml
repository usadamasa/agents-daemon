version: 3

workdir: .

# go-arch-lint は workdir の下を全部走査し、見つけた .go を「component に無いファイル」として数える。
# Claude Code の worktree (.claude/worktrees/<name>/) はリポジトリの丸ごとの複製、tmp/ は gitignore 済みの
# 作業領域で試し書きの .go が置かれるので、どちらも linter の対象にしない。
exclude:
  - .claude
  - tmp

# component は依存のクラスタから読み直した「家族」と、どの家族からも使われる「共有層」(#300)。
# 共有層は共有層の中だけで閉じ、家族は共有層にだけ依存する。家族から家族へ向かう辺は無い。
# rex の実装 (runtime/backend/rexcli/**) は呼び手の backend の下に入れ子で、runtime の一部。
# runtime は internal/runtime/ の下に集めたので glob で書く。ほかの家族と共有層は internal/ 直下に並び、
# ディレクトリが家族か共有層かを表さないので、in はパッケージの明示的なリスト。
# 新しいパッケージは、どの家族か共有層かを決めて in に足さないと analyze-arch-lint の uncovered で落ちる。
# この設定自体の健全性は `go tool analyze-arch-lint --metrics` と `--strict .` で見る。
components:
  cmd:
    in: "cmd/**"
  shared:
    in:
      - "internal/apppath"
      - "internal/statefile"
      - "internal/applog"
      - "internal/gitrepo"
      - "internal/ref"
      - "internal/multiplexer"
      - "internal/multiplexer/multiplexerfake"
      - "internal/sessioncontext"
      - "internal/ratelimit"
      - "internal/sessionstate"
      - "internal/tasklog"
      - "internal/tasklog/record"
      - "internal/parking"
      - "internal/edge"
      - "internal/eventlog"
      - "internal/daemonstate"
      - "internal/protocol"
      - "internal/protocol/generate"
  handoff:
    in:
      - "internal/deps/**"
      - "internal/spawn"
  runtime:
    in: "internal/runtime/**"
  dream:
    in: "internal/dream/**"
  statusline:
    in: "internal/statusline/**"
  worktree:
    in: "internal/worktree"

vendors:
  cobra:
    in: github.com/spf13/cobra
  # rexcli のテストが fake の rex に渡った引数列を戻すのに使う。
  shellquote:
    in: github.com/kballard/go-shellquote
  # protocol が mod と受け渡す JSON を schema で確かめるのに使う。
  jsonschema:
    in: github.com/google/jsonschema-go/jsonschema

deps:
  cmd:
    mayDependOn:
      - cmd
      - shared
      - handoff
      - runtime
      - dream
      - statusline
      - worktree
    canUse:
      - cobra
  shared:
    mayDependOn:
      - shared
    canUse:
      - jsonschema
  handoff:
    mayDependOn:
      - shared
      - handoff
  runtime:
    mayDependOn:
      - shared
      - runtime
    canUse:
      - shellquote
  dream:
    mayDependOn:
      - shared
      - dream
  statusline:
    mayDependOn:
      - shared
      - statusline
