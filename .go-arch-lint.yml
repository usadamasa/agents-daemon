version: 3

workdir: .

# この設定自体の健全性は `go tool analyze-arch-lint --metrics` と `--strict .` で見る。
components:
  cmd_main:
    in: "cmd/*"
  internal:
    in: "internal/**"

vendors:
  cobra:
    in: github.com/spf13/cobra
  # rexcli のテストが fake の rex に渡った引数列を戻すのに使う。
  shellquote:
    in: github.com/kballard/go-shellquote

deps:
  cmd_main:
    mayDependOn:
      - internal
    canUse:
      - cobra
  internal:
    mayDependOn:
      - internal
    canUse:
      - shellquote
