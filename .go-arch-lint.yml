version: 3

workdir: .

# この設定自体の健全性は `go tool analyze-arch-lint --metrics` と `--strict .` で見る｡
components:
  cmd_main:
    in: "cmd/*"
  internal:
    in: "internal/**"

vendors:
  cobra:
    in: github.com/spf13/cobra

deps:
  cmd_main:
    mayDependOn:
      - internal
    canUse:
      - cobra
  internal:
    mayDependOn:
      - internal
