version: 3

workdir: .

# go-arch-lint は workdir の下を全部走査し、見つけた .go を「component に無いファイル」として数える。
# Claude Code の worktree (.claude/worktrees/<name>/) はリポジトリの丸ごとの複製、tmp/ は gitignore 済みの
# 作業領域で試し書きの .go が置かれるので、どちらも linter の対象にしない。
exclude:
  - .claude
  - tmp

# この設定自体の健全性は `go tool analyze-arch-lint --metrics` と `--strict .` で見る。
components:
  cmd_main:
    in: "cmd/**"
  internal:
    in: "internal/**"

vendors:
  cobra:
    in: github.com/spf13/cobra
  # rexcli のテストが fake の rex に渡った引数列を戻すのに使う。
  shellquote:
    in: github.com/kballard/go-shellquote

deps:
  cmd_main:
    mayDependOn:
      - cmd_main
      - internal
    canUse:
      - cobra
  internal:
    mayDependOn:
      - internal
    canUse:
      - shellquote
