version: '3'

tasks:
  build:
    desc: cmd/ の全 Go バイナリを bin/ にビルド
    # -o に末尾スラッシュ付きのディレクトリを渡すと、go は main パッケージだけを選んで出力する。
    # protocol の生成器 (internal/protocol/generate) は開発用なので含めない。
    cmds:
      - go build -o ./bin/ ./cmd/...

  install:
    desc: agents-daemon を hook と同じキャッシュ上の場所へビルドする
    # SessionStart hook が使うビルドスクリプトをそのまま呼ぶ。置き場所と stamp の書き方を
    # 1 箇所に閉じるため。動作中の daemon は実行ファイルの差し替えを検知して入れ替わる
    # (daemon/selfupdate.go)。
    cmds:
      - hooks/build-daemon.sh

  gui:frontend:
    desc: gui/frontend/src と npm の dagre から gui/frontend/dist (main.go が embed する) を組む
    # bundler は使わない。src をそのまま写し、配置の library だけ node_modules から vendor/ に写す。
    dir: gui/frontend
    cmds:
      - npm ci --no-audit --no-fund
      - rm -rf dist
      - mkdir -p dist/vendor
      - cp -R src/. dist/
      - cp node_modules/@dagrejs/dagre/dist/dagre.esm.js dist/vendor/dagre.esm.js

  gui:build:
    desc: タスクの依存図のアプリ (gui/、別 module) を bin/agent-tasks にビルドする。macOS だけ
    # root の module に Wails を混ぜない (cgo と WebKit の link が SessionStart hook の go build と Linux の CI に
    # 載らない) ので、-C で gui/ の module に入ってビルドする。deployment target は wails3 CLI の darwin の
    # build task と同じ 12.0 に揃える (揃えないと ld が object ごとに版の食い違いを警告する)。
    deps: [gui:frontend]
    env: &gui-env
      CGO_CFLAGS: -mmacosx-version-min=12.0
      CGO_LDFLAGS: -mmacosx-version-min=12.0
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    cmds:
      - go build -C gui -o ../bin/agent-tasks .

  gui:test:
    desc: gui/ の module のテスト (Wails の link が要るので macOS だけ。CI には載せない)
    # main.go が embed する frontend/dist は生成物なので、先に組まないと vet が落ちる
    deps: [gui:frontend]
    dir: gui
    env: *gui-env
    cmds:
      - go vet ./...
      - gosec -quiet ./...
      - go test ./...
      # フロントエンドの DOM に依らない部分 (graph.js、memo.js) は frontend/test を node --test で回す
      - npm --prefix frontend test

  gui:install:
    desc: bin/agent-tasks を ~/Applications/agent-tasks.app に置く (ad hoc 署名、手元でだけ動く)
    deps: [gui:build]
    cmds:
      - mkdir -p ~/Applications/agent-tasks.app/Contents/MacOS
      - cp bin/agent-tasks ~/Applications/agent-tasks.app/Contents/MacOS/agent-tasks
      # build/ は global の gitignore に当たるので darwin/ に置く
      - cp gui/darwin/Info.plist ~/Applications/agent-tasks.app/Contents/Info.plist
      - codesign --force --sign - ~/Applications/agent-tasks.app

  test:
    desc: Go テストと bats テストを実行
    cmds:
      - go test ./...
      - bats tests/

  fuzz:
    desc: go の fuzz target を 1 つずつ回す (FUZZTIME で 1 target あたりの時間。既定 30s)
    cmds:
      - scripts/fuzz.sh

  model-check:
    desc: models/ の TLA+ のモデルを TLC で回し、期待 (反例なし / 反例あり) と突き合わせる
    cmds:
      - scripts/model-check.sh

  typecheck:
    desc: mod (hooks/ と types/) を ci/mod-types/ に写した型で tsc にかける。手元と worktree と CI で同じ型を使う
    cmds:
      - tsc -p ci/mod-types

  protocol:generate:
    desc: protocol.schema.json から Go の型と mod の型 (types/index.d.ts の生成の印の間、hooks/protocol.ts) を作り直す
    cmds:
      - go generate ./internal/protocol

  mod-types:sync:
    desc: .claude-plugin/types/ の型を ci/mod-types/ へ写す。Claude Code を上げて mod の API を使い始めたら打つ
    cmds:
      - scripts/sync-mod-types.sh

  test-cover:
    desc: カバレッジ付きテスト
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  vet:
    desc: go vet を実行
    cmds:
      - go vet ./...

  lint:
    desc: Go の全静的解析を実行
    cmds:
      - golangci-lint run --timeout 5m ./...
      - go-arch-lint check
      # go-arch-lint はコードが設定に違反していないかしか見ない。設定そのものが
      # パッケージツリーの転記へ劣化していく方向はこちらが止める。指標の意味と対処は
      # `go tool analyze-arch-lint --metrics`。
      - go tool analyze-arch-lint --strict .
      - task: vulncheck
      # gui/ は別 module (Wails のアプリ) で、gui:test が自分で gosec を回す。./... は入れ子の module の .go も拾うので外す
      - gosec -exclude-dir=gui ./...
      # 揮発性を git の履歴から測り、base の commit と比べる。CI の checkout は fetch-depth: 0 にする
      - scripts/analyze-modularity.sh

  vulncheck:
    desc: govulncheck を symbol モードで実行 (lint と週次の vulncheck workflow が呼ぶ)
    cmds:
      - go tool vulncheck ./...

  vulncheck:module:
    desc: govulncheck を module モードで実行 (週次の vulncheck workflow が表示だけに使う)
    # 到達しない修正版無しの脆弱性でも落ちるため、合否には入れない
    cmds:
      # -scan module はルートに Go ファイルが無いと落ちるので、main パッケージのディレクトリで回す
      - go tool vulncheck -C cmd/agents-daemon -scan module
