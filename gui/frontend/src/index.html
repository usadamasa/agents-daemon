<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent-tasks</title>
<link rel="stylesheet" href="./style.css">
<!-- runtime.js は Wails の asset server が出す ES module で、window.wails に Call と Events を置く -->
<script type="module" src="/wails/runtime.js"></script>
<script type="module" src="./app.js"></script>
</head>
<body>
<header class="bar">
  <span class="ph">タスク</span>
  <label class="sw" id="completed-toggle" hidden><input type="checkbox" id="completed-check"> <span id="completed-label"></span></label>
  <span class="grow"></span>
  <button class="tb upgrade" type="button" id="upgrade" hidden>↻ Update</button>
</header>
<div class="stage">
  <div class="main">
    <!-- #graph はスクロールし、描き直しで中身を作り直すので、操作はその外に置く -->
    <span class="zoom" role="group" aria-label="拡大縮小">
      <button class="tb sm" type="button" id="zoom-out" aria-label="縮小" title="縮小 (Cmd + ホイール、ピンチでも)">−</button>
      <button class="tb sm" type="button" id="zoom-reset" title="100% に戻す">100%</button>
      <button class="tb sm" type="button" id="zoom-in" aria-label="拡大" title="拡大">+</button>
      <button class="tb sm" type="button" id="zoom-fit" aria-label="全体を表示" aria-pressed="true" title="全体を表示 (オンの間は図全体がウィンドウに収まる拡大率へ合わせ続ける。拡大縮小するとオフ)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </span>
    <main class="graph" id="graph">
      <div class="empty" id="empty">依存図を読んでいる…</div>
    </main>
    <div class="lg" id="legend" hidden>
      <span><i aria-hidden="true"></i>同じセッションの blockedBy</span>
      <span><i class="d" aria-hidden="true"></i>セッションをまたぐ依存</span>
      <span><i class="c" aria-hidden="true"></i>longest chain</span>
      <span class="grow"></span>
      <button class="tb sm" type="button" id="dismiss-ended" hidden></button>
    </div>
    <section class="park" id="park" hidden>
      <div class="hd">
        <span class="hd-title" id="park-title">メモ</span>
        <select class="tb sm" id="repo-filter" aria-label="repo で絞る"><option value="">すべての repo</option></select>
        <span class="grow"></span>
        <button class="tb sm" type="button" id="discard-stale" hidden></button>
      </div>
      <div class="ls" id="park-list"></div>
    </section>
  </div>
  <aside class="column" id="column" aria-label="終わった作業" hidden></aside>
</div>
<footer class="foot" id="foot"><span class="dot"></span><span id="foot-text">daemon の状態を読んでいる…</span></footer>
<div class="pop" id="pop" role="dialog" hidden></div>
</body>
</html>
